<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="carousel.jsx"></script>
<script type="text/babel" src="images.standalone.jsx"></script>
<script type="text/babel" src="content.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVariant": "catalog",
  "fonts": "default",
  "palette": "green",
  "tone": "punk"
}/*EDITMODE-END*/;

function Nav({ c, tone }) {
  return (
    <nav className="fp-nav">
      <div className="fp-container fp-nav-inner">
        <a href="#" className="fp-logo" aria-label="FLOWERPUNK">
          <img src="logo.svg" alt="FLOWERPUNK" />
        </a>
        <div className="fp-nav-links">
          {c.nav.map((n, i) => (
            <a key={i} href={["#how","#tiers","#portfolio","#care","#faq"][i] || "#"}>{n}</a>
          ))}
        </div>
        <a href="#contact" className="fp-cta">{c.cta} →</a>
      </div>
    </nav>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const c = window.FP_CONTENT[t.tone] || window.FP_CONTENT.punk;

  React.useEffect(() => {
    document.documentElement.setAttribute("data-palette", t.palette);
    document.documentElement.setAttribute("data-fonts", t.fonts);
  }, [t.palette, t.fonts]);

  return (
    <div className="fp-page">
      <Nav c={c} tone={t.tone} />
      <Hero c={c} variant={t.heroVariant} />
      <Ticker items={c.ticker} />
      <How c={c} />
      <Tiers c={c} />
      <Portfolio c={c} />
      <Care c={c} />
      <FAQ c={c} />
      <Contact c={c} />
      <Footer c={c} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Hero layout" />
        <TweakRadio
          label="Variant"
          value={t.heroVariant}
          options={[
            { value: "split", label: "Split" },
            { value: "billboard", label: "Billboard" },
            { value: "catalog", label: "Catalog" },
          ]}
          onChange={(v) => setTweak("heroVariant", v)}
        />
        <TweakSection label="Type" />
        <TweakSelect
          label="Font pairing"
          value={t.fonts}
          options={[
            { value: "default", label: "Unbounded × Inter Tight" },
            { value: "serif", label: "Fraunces × Inter Tight" },
            { value: "grotesk", label: "Space Grotesk only" },
            { value: "mixed", label: "Unbounded × Inter Tight (alt)" },
          ]}
          onChange={(v) => setTweak("fonts", v)}
        />
        <TweakSection label="Color" />
        <TweakRadio
          label="Accent"
          value={t.palette}
          options={[
            { value: "green", label: "Acid" },
            { value: "pink", label: "Punk" },
            { value: "orange", label: "Coral" },
            { value: "ink", label: "Ink" },
          ]}
          onChange={(v) => setTweak("palette", v)}
        />
        <TweakSection label="Voice" />
        <TweakRadio
          label="Tone of copy"
          value={t.tone}
          options={[
            { value: "punk", label: "Punk" },
            { value: "lux", label: "Luxe" },
            { value: "craft", label: "Craft" },
          ]}
          onChange={(v) => setTweak("tone", v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
